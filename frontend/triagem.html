<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem - Baymax</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .list-panel { flex: 1; }
        .form-panel { flex: 1.5; }
        h2 { margin-bottom: 15px; color: #333; }
        ul { list-style: none; }
        li { padding: 12px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        button { cursor: pointer; padding: 8px 12px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-call { background-color: #f39c12; color: #fff; margin-right: 5px; }
        .btn-select { background-color: #3498db; color: #fff; }
        .btn-submit { background-color: #2ecc71; color: #fff; width: 100%; padding: 12px; font-size: 16px; margin-top: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .sinais { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; padding: 12px; border: 1px solid #dce4e9; border-radius: 6px; }
        .sinais legend { padding: 0 6px; font-size: 12px; font-weight: 700; color: #566672; }
        .sinais .form-group { margin: 0; }
        .sinais label { font-size: 11px; }
        @media (max-width: 520px) { .sinais { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
    <link rel="stylesheet" href="css/system.css">
</head>

<body class="page-workflow page-triagem">

<div class="container">
    <!-- FILA DE ESPERA -->
    <div class="panel list-panel">
        <h2>Fila de Espera</h2>
        <p id="status-fila-triagem" class="queue-status" role="status" aria-live="polite">Carregando pacientes...</p>
        <ul id="lista-pacientes">
        </ul>
    </div>

    <!-- FORMULÁRIO DE TRIAGEM -->
    <div class="panel form-panel">
        <h2>Realizar Triagem</h2>
        <form id="form-triagem">
            <input type="hidden" id="pacienteId">
            
            <div class="form-group">
                <label>Nome do Paciente:</label>
                <input type="text" id="nome" readonly placeholder="Selecione um paciente na fila">
            </div>

            <div class="form-group">
                <label>Sintomas:</label>
                <textarea id="sintoma" rows="2" required></textarea>
            </div>

            <div class="form-group">
                <label>Temperatura (°C):</label>
                <input type="number" step="0.1" min="30" max="45" id="temperatura" required>
            </div>

            <fieldset class="sinais">
                <legend>Sinais vitais (opcional)</legend>
                <div class="form-group">
                    <label for="pressao">Pressão (mmHg)</label>
                    <input type="text" id="pressao" placeholder="120/80" inputmode="numeric" maxlength="7" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="fc">Freq. cardíaca (bpm)</label>
                    <input type="number" id="fc" min="20" max="250" step="1">
                </div>
                <div class="form-group">
                    <label for="fr">Freq. respiratória (irpm)</label>
                    <input type="number" id="fr" min="4" max="80" step="1">
                </div>
                <div class="form-group">
                    <label for="spo2">Saturação SpO₂ (%)</label>
                    <input type="number" id="spo2" min="50" max="100" step="1">
                </div>
                <div class="form-group">
                    <label for="dor">Dor (0 a 10)</label>
                    <input type="number" id="dor" min="0" max="10" step="1">
                </div>
                <div class="form-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" min="0.5" max="400" step="0.1">
                </div>
            </fieldset>

            <div class="form-group">
                <label>Alergias:</label>
                <input type="text" id="alergia" placeholder="Caso houver">
            </div>

            <div class="form-group">
                <label>Classificação de Risco Manual (Opcional):</label>
                <select id="risco">
                    <option value="">Automático (com base nos sinais vitais)</option>
                    <option value="verde">Verde (Pouco Urgente)</option>
                    <option value="amarelo">Amarelo (Urgente)</option>
                    <option value="vermelho">Vermelho (Emergência)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Observações:</label>
                <textarea id="observacao" rows="2"></textarea>
            </div>

            <button type="submit" class="btn-submit">Finalizar Triagem e Enviar ao Médico</button>
        </form>
    </div>
</div>

<dialog id="modal-paciente-triagem" class="patient-modal">
    <div class="patient-modal-content">
        <div class="patient-modal-heading">
            <div><span class="admin-eyebrow">FICHA DO PACIENTE</span><h2 id="detalhe-nome-triagem">Informações do paciente</h2></div>
            <button type="button" class="patient-modal-close" aria-label="Fechar" id="fechar-detalhe-triagem">×</button>
        </div>
        <div id="detalhe-dados-triagem" class="patient-detail-grid"></div>
    </div>
</dialog>

<script src="js/app.js"></script>
<script>
    const listaPacientes = document.getElementById("lista-pacientes");
    const statusFila = document.getElementById("status-fila-triagem");
    const modalPaciente = document.getElementById("modal-paciente-triagem");
    let atualizandoFila = false;
    let assinaturaFila = null;

    function formatarDataHora(valor) {
        if (!valor) return "Horário não informado";
        const data = new Date(valor);
        if (Number.isNaN(data.getTime())) return "Horário não informado";
        return new Intl.DateTimeFormat("pt-BR", {
            dateStyle: "short",
            timeStyle: "short"
        }).format(data);
    }

    async function lerResposta(resposta) {
        const texto = await resposta.text();
        let dados;
        try {
            dados = texto ? JSON.parse(texto) : {};
        } catch (erro) {
            throw new Error("Resposta inválida do servidor.");
        }
        if (!resposta.ok) throw new Error(dados.erro || "Não foi possível concluir a operação.");
        return dados;
    }

    function abrirInformacoes(paciente) {
        document.getElementById("detalhe-nome-triagem").textContent =
            paciente.nome || "Informações do paciente";
        const conteudo = document.getElementById("detalhe-dados-triagem");
        conteudo.replaceChildren();
        const campos = [
            ["Data/hora de entrada", formatarDataHora(paciente.createdAt)],
            ["CPF", paciente.cpf],
            ["Tipo de atendimento", paciente.tipo],
            ["Telefone", paciente.telefone],
            ["E-mail", paciente.email],
            ["Endereço", paciente.endereco],
            ["Nome da mãe", paciente.nome_mae],
            ["Sexo", paciente.sexo],
            ["Estado civil", paciente.estado_civil],
            ["Contato de emergência", paciente.contato_emergencia],
            ["Alergias", (paciente.alergias || []).join(", ")],
            ["Doenças preexistentes", paciente.doencasPreexistentes],
            ["Histórico médico", paciente.historicoMedico]
        ];
        campos.forEach(([rotulo, valor]) => {
            if (!valor) return;
            const item = document.createElement("div");
            item.className = "patient-detail";
            const label = document.createElement("span");
            label.textContent = rotulo;
            const valorEl = document.createElement("strong");
            valorEl.textContent = String(valor);
            item.append(label, valorEl);
            conteudo.appendChild(item);
        });
        modalPaciente.showModal();
    }

    async function chamarTV(paciente) {
        try {
            const resposta = await Baymax.fetch("/tv/chamar", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify({
                    paciente: paciente.nome,
                    localTipo: "TRIAGEM",
                    localNumero: "01"
                })
            });
            await lerResposta(resposta);
            alert(`Paciente ${paciente.nome} chamado na TV.`);
        } catch (erro) {
            console.error("Erro ao chamar paciente na TV:", erro);
            alert(erro.message || "Não foi possível chamar o paciente.");
        }
    }

    function selecionarPaciente(paciente) {
        document.getElementById("pacienteId").value = paciente.id;
        document.getElementById("nome").value = paciente.nome || "";
        document.getElementById("sintoma").focus();
    }

    async function carregarFila() {
        if (atualizandoFila) return;
        atualizandoFila = true;
        try {
            const resposta = await Baymax.fetch("/pacientes/triagem", {
                headers: { "Accept": "application/json" }
            });
            const pacientes = await lerResposta(resposta);
            if (!Array.isArray(pacientes)) throw new Error("A fila recebida é inválida.");

            statusFila.textContent = pacientes.length
                ? `${pacientes.length} paciente${pacientes.length === 1 ? "" : "s"} aguardando · atualizado às ${formatarDataHora(new Date())}`
                : `Nenhum paciente aguardando · atualizado às ${formatarDataHora(new Date())}`;

            const assinaturaAtual = JSON.stringify([Math.floor(Date.now() / 60000), pacientes]);
            if (assinaturaAtual === assinaturaFila) return;
            assinaturaFila = assinaturaAtual;
            listaPacientes.replaceChildren();

            if (!pacientes.length) {
                const vazio = document.createElement("li");
                vazio.className = "queue-empty";
                vazio.textContent = "A fila de triagem está vazia.";
                listaPacientes.appendChild(vazio);
                return;
            }

            pacientes.forEach(paciente => {
                const li = document.createElement("li");
                li.className = "queue-patient";
                const info = document.createElement("div");
                info.className = "queue-patient-info";
                const nome = document.createElement("strong");
                nome.textContent = paciente.nome || "Paciente sem nome";
                const tipo = document.createElement("span");
                tipo.textContent = paciente.tipo || "Tipo não informado";
                const hora = document.createElement("time");
                hora.dateTime = paciente.createdAt || "";
                hora.textContent = `Entrada: ${formatarDataHora(paciente.createdAt)}`;
                const esp = Baymax.espera(paciente.createdAt, "");
                const aguardando = document.createElement("span");
                aguardando.textContent = `Aguardando há ${esp.texto}`;
                info.append(nome, tipo, hora, aguardando);

                const acoes = document.createElement("div");
                acoes.className = "queue-actions";
                [
                    ["Ver informações", "queue-details", () => abrirInformacoes(paciente)],
                    ["Chamar na TV", "btn-call", () => chamarTV(paciente)],
                    ["Atender", "btn-select", () => selecionarPaciente(paciente)]
                ].forEach(([texto, classe, acao]) => {
                    const botao = document.createElement("button");
                    botao.type = "button";
                    botao.className = classe;
                    botao.textContent = texto;
                    botao.addEventListener("click", acao);
                    acoes.appendChild(botao);
                });
                li.append(info, acoes);
                listaPacientes.appendChild(li);
            });
        } catch (error) {
            console.error("Erro ao carregar fila:", error);
            statusFila.textContent = error.message || "Erro ao carregar pacientes.";
        } finally {
            atualizandoFila = false;
        }
    }

    document.getElementById("form-triagem").addEventListener("submit", async (e) => {
        e.preventDefault();

        const pacienteId = document.getElementById("pacienteId").value;
        if (!pacienteId) {
            alert("Selecione um paciente na lista primeiro!");
            return;
        }

        const dados = {
            pacienteId: Number(pacienteId),
            nome: document.getElementById("nome").value,
            sintoma: document.getElementById("sintoma").value,
            temperatura: parseFloat(document.getElementById("temperatura").value),
            pressao: document.getElementById("pressao").value,
            fc: document.getElementById("fc").value,
            fr: document.getElementById("fr").value,
            spo2: document.getElementById("spo2").value,
            dor: document.getElementById("dor").value,
            peso: document.getElementById("peso").value,
            alergia: document.getElementById("alergia").value,
            risco: document.getElementById("risco").value || undefined,
            observacao: document.getElementById("observacao").value
        };

        const botao = e.submitter;
        if (botao) {
            botao.disabled = true;
            botao.textContent = "Salvando triagem...";
        }
        try {
            const res = await Baymax.fetch("/triagem", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify(dados)
            });
            const triagem = await lerResposta(res);
            const motivos = (triagem.motivosRisco || []).map(m => `• ${m}`).join("\n");
            alert(
                `Triagem concluída com sucesso!\n\nClassificação de risco: ${String(triagem.risco).toUpperCase()}` +
                (motivos ? `\n${motivos}` : "")
            );
            document.getElementById("form-triagem").reset();
            // reset() não limpa campos hidden: sem isto o paciente anterior continuaria selecionado
            document.getElementById("pacienteId").value = "";
            assinaturaFila = null;
            carregarFila();
        } catch (error) {
            console.error("Erro ao salvar triagem:", error);
            alert(error.message || "Não foi possível salvar a triagem.");
        } finally {
            if (botao) {
                botao.disabled = false;
                botao.textContent = "Finalizar Triagem e Enviar ao Médico";
            }
        }
    });

    document.getElementById("fechar-detalhe-triagem").addEventListener(
        "click",
        () => modalPaciente.close()
    );
    modalPaciente.addEventListener("click", evento => {
        if (evento.target === modalPaciente) modalPaciente.close();
    });

    if (Baymax.iniciar(["triagem"])) {
        carregarFila();
        window.setInterval(carregarFila, 5000);
    }
</script>

</body>
</html>
