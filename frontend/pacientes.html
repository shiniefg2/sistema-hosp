<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087eac">
  <title>Pacientes - Baymax</title>
  <link rel="stylesheet" href="css/system.css">
</head>
<body class="page-module page-patients">
  <main class="module-layout">
    <header class="module-heading">
      <div>
        <span class="module-kicker">GESTÃO DE PACIENTES</span>
        <h1>Cadastro de pacientes</h1>
        <p>Consulte cadastros existentes ou registre um novo paciente.</p>
      </div>
    </header>

    <nav class="patient-sections" aria-label="Ações de pacientes">
      <button class="patient-section-button active" id="mostrar-busca" type="button" aria-pressed="true">
        Pesquisar pacientes
      </button>
      <button class="patient-section-button" id="mostrar-cadastro" type="button" aria-pressed="false">
        Cadastrar paciente
      </button>
    </nav>

    <div class="patient-panels">
      <section class="module-panel patient-panel" id="painel-busca" aria-labelledby="titulo-busca">
        <h2 id="titulo-busca">Pacientes cadastrados</h2>
        <label class="module-field" for="busca">
          Buscar por nome ou CPF
          <input class="module-search" id="busca" type="search" autocomplete="off" placeholder="Digite ao menos 2 caracteres">
        </label>
        <p class="module-hint" id="busca-ajuda">A pesquisa retorna até 100 cadastros correspondentes.</p>
        <div class="module-list" id="lista-pacientes" aria-live="polite">
          <p class="module-empty">Digite um nome ou CPF para pesquisar.</p>
        </div>
      </section>

      <section class="module-panel patient-panel" id="painel-cadastro" aria-labelledby="titulo-formulario" hidden>
        <h2 id="titulo-formulario">Novo paciente</h2>
        <form class="module-form" id="form-paciente">
          <input type="hidden" id="pessoa-id">
          <div class="module-fields">
            <label class="module-field" for="nome">Nome completo *
              <input id="nome" name="nome" maxlength="150" autocomplete="name" required>
            </label>
            <label class="module-field" for="cpf">CPF *
              <input id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required>
            </label>
            <label class="module-field" for="nome_mae">Nome da mãe
              <input id="nome_mae" name="nome_mae" maxlength="150">
            </label>
            <label class="module-field" for="telefone">Telefone
              <input id="telefone" name="telefone" type="tel" maxlength="30" autocomplete="tel">
            </label>
            <label class="module-field" for="email">Email
              <input id="email" name="email" type="email" maxlength="150" autocomplete="email">
            </label>
            <label class="module-field" for="contato_emergencia">Contato de emergência
              <input id="contato_emergencia" name="contato_emergencia" maxlength="150">
            </label>
            <label class="module-field full" for="endereco">Endereço
              <input id="endereco" name="endereco" maxlength="200" autocomplete="street-address">
            </label>
            <label class="module-field" for="estado_civil">Estado civil
              <select id="estado_civil" name="estado_civil">
                <option value="">Não informado</option>
                <option>Casado(a)</option>
                <option>Separado(a)</option>
                <option>Solteiro(a)</option>
              </select>
            </label>
            <label class="module-field" for="sexo">Sexo
              <select id="sexo" name="sexo">
                <option value="">Não informado</option>
                <option>Masculino</option>
                <option>Feminino</option>
              </select>
            </label>
            <label class="module-field" for="tipo">Plano / modalidade
              <select id="tipo" name="tipo">
                <option value="Geral">Geral</option>
                <option value="Convenio">Convênio</option>
                <option value="Particular">Particular</option>
                <option value="SUS">SUS</option>
              </select>
            </label>
            <label class="module-field full clinico" for="alergias">Alergias (separe por vírgula)
              <textarea id="alergias" name="alergias" maxlength="1000" rows="2"></textarea>
            </label>
            <label class="module-field full clinico" for="doencasPreexistentes">Doenças preexistentes
              <textarea id="doencasPreexistentes" name="doencasPreexistentes" maxlength="1000" rows="2"></textarea>
            </label>
            <label class="module-field full clinico" for="historicoMedico">Histórico médico relevante
              <textarea id="historicoMedico" name="historicoMedico" maxlength="2000" rows="3"></textarea>
            </label>
          </div>
          <p class="module-message" id="mensagem" role="status" aria-live="polite"></p>
          <div class="module-actions">
            <button type="submit" id="salvar">Cadastrar paciente</button>
            <button type="button" class="module-secondary" id="limpar">Limpar formulário</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const sessao = Baymax.iniciar(["atendimento", "medico", "triagem"]);
    const form = document.getElementById("form-paciente");
    const lista = document.getElementById("lista-pacientes");
    const busca = document.getElementById("busca");
    const pessoaId = document.getElementById("pessoa-id");
    const mensagem = document.getElementById("mensagem");
    const salvar = document.getElementById("salvar");
    const painelBusca = document.getElementById("painel-busca");
    const painelCadastro = document.getElementById("painel-cadastro");
    const botaoBusca = document.getElementById("mostrar-busca");
    const botaoCadastro = document.getElementById("mostrar-cadastro");
    let temporizadorBusca;

    function mostrarPainel(painel) {
      const cadastroAtivo = painel === "cadastro";
      painelBusca.hidden = cadastroAtivo;
      painelCadastro.hidden = !cadastroAtivo;
      botaoBusca.classList.toggle("active", !cadastroAtivo);
      botaoCadastro.classList.toggle("active", cadastroAtivo);
      botaoBusca.setAttribute("aria-pressed", String(!cadastroAtivo));
      botaoCadastro.setAttribute("aria-pressed", String(cadastroAtivo));
    }

    botaoBusca.addEventListener("click", () => mostrarPainel("busca"));
    botaoCadastro.addEventListener("click", () => mostrarPainel("cadastro"));

    if (sessao && !["admin", "medico", "triagem"].includes(sessao.tipo)) {
      document.querySelectorAll(".clinico").forEach(campo => campo.hidden = true);
    }

    function exibirMensagem(texto, tipo = "") {
      mensagem.textContent = texto;
      mensagem.className = `module-message${tipo ? ` ${tipo}` : ""}`;
    }

    function limparFormulario() {
      form.reset();
      pessoaId.value = "";
      document.getElementById("cpf").readOnly = false;
      document.getElementById("titulo-formulario").textContent = "Novo paciente";
      salvar.textContent = "Cadastrar paciente";
      exibirMensagem("");
    }

    function selecionarPessoa(pessoa) {
      pessoaId.value = pessoa.id;
      for (const [campo, valor] of Object.entries(pessoa)) {
        const entrada = form.elements.namedItem(campo);
        if (entrada && campo !== "id") {
          entrada.value = Array.isArray(valor) ? valor.join(", ") : valor || "";
        }
      }
      document.getElementById("cpf").readOnly = true;
      document.getElementById("titulo-formulario").textContent = "Editar cadastro";
      salvar.textContent = "Salvar alterações";
      exibirMensagem("");
      mostrarPainel("cadastro");
    }

    function renderizarPessoas(pessoas) {
      lista.replaceChildren();
      if (!pessoas.length) {
        const vazio = document.createElement("p");
        vazio.className = "module-empty";
        vazio.textContent = "Nenhum paciente encontrado.";
        lista.appendChild(vazio);
        return;
      }

      pessoas.forEach(pessoa => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "module-record";
        item.append(
          Object.assign(document.createElement("strong"), { textContent: pessoa.nome }),
          Object.assign(document.createElement("small"), { textContent: `CPF: ${pessoa.cpf}` }),
          Object.assign(document.createElement("small"), { textContent: pessoa.telefone || "Telefone não informado" })
        );
        item.addEventListener("click", () => selecionarPessoa(pessoa));
        lista.appendChild(item);
      });
    }

    async function pesquisarPessoas() {
      const termo = busca.value.trim();
      if (termo.length < 2) {
        lista.replaceChildren();
        const vazio = document.createElement("p");
        vazio.className = "module-empty";
        vazio.textContent = "Digite um nome ou CPF para pesquisar.";
        lista.appendChild(vazio);
        return;
      }

      lista.replaceChildren(Object.assign(document.createElement("p"), {
        className: "module-empty",
        textContent: "Pesquisando..."
      }));
      try {
        renderizarPessoas(await Baymax.api(`/pessoas?busca=${encodeURIComponent(termo)}`));
      } catch (erro) {
        exibirMensagem(erro.message, "error");
        lista.replaceChildren(Object.assign(document.createElement("p"), {
          className: "module-empty",
          textContent: erro.message
        }));
      }
    }

    busca.addEventListener("input", () => {
      clearTimeout(temporizadorBusca);
      temporizadorBusca = setTimeout(pesquisarPessoas, 250);
    });

    document.getElementById("limpar").addEventListener("click", limparFormulario);

    form.addEventListener("submit", async evento => {
      evento.preventDefault();
      if (salvar.disabled) return;

      salvar.disabled = true;
      salvar.textContent = "Salvando...";
      exibirMensagem("");
      const dados = Object.fromEntries(new FormData(form).entries());
      delete dados.id;

      try {
        if (pessoaId.value) {
          await Baymax.api(`/pessoas/${encodeURIComponent(pessoaId.value)}`, { method: "PUT", body: dados });
          limparFormulario();
          exibirMensagem("Cadastro atualizado.", "success");
        } else {
          await Baymax.api("/pessoas", { method: "POST", body: dados });
          limparFormulario();
          exibirMensagem("Paciente cadastrado.", "success");
        }
        await pesquisarPessoas();
      } catch (erro) {
        exibirMensagem(erro.message, "error");
      } finally {
        salvar.disabled = false;
        salvar.textContent = pessoaId.value ? "Salvar alterações" : "Cadastrar paciente";
      }
    });
  </script>
</body>
</html>
