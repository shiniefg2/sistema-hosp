<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicações Disponíveis</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 30px 15px;
      background: #f1f3f8;
      color: #333;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 28px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 5px 20px #00000012;
    }

    .voltar {
      display: inline-block;
      margin-bottom: 22px;
      color: #3409db;
      text-decoration: none;
    }

    h1 {
      margin-bottom: 22px;
      font-size: 25px;
      text-align: center;
    }

    h2 {
      margin: 25px 0 15px;
      font-size: 19px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      margin-bottom: -6px;
    }

    input, button {
      min-height: 45px;
      padding: 12px;
      border-radius: 7px;
      font-size: 15px;
    }

    input {
      width: 100%;
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #3409db;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button[hidden] {
      display: none;
    }

    button:hover {
      filter: brightness(.9);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .cancelar {
      background: #687386;
    }

    .excluir {
      background: #c62828;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 15px;
      border: 1px solid #e2e5ed;
      border-left: 4px solid #3409db;
      border-radius: 8px;
      background: #f9faff;
    }

    .item.baixo {
      border-left-color: #e68a00;
    }

    .item.zerado {
      border-left-color: #c62828;
    }

    .info {
      flex: 1;
      min-width: 140px;
    }

    .nome {
      display: block;
      overflow-wrap: anywhere;
      font-weight: bold;
    }

    .estoque {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      background: #e6f4ea;
      color: #18733b;
      font-size: 13px;
      font-weight: bold;
    }

    .baixo .estoque {
      background: #fff3e0;
      color: #b36b00;
    }

    .zerado .estoque {
      background: #fdeaea;
      color: #c62828;
    }

    .acoes {
      display: flex;
      gap: 8px;
    }

    .acoes button {
      min-width: 85px;
    }

    #mensagem {
      margin-top: 15px;
      line-height: 1.5;
    }

    .sucesso {
      color: #18733b;
    }

    .erro {
      color: #c62828;
    }

    .vazio {
      color: #777;
      line-height: 1.5;
    }

    .med-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    .med-topo h1 { margin: 0; }
    h2.primeiro { margin-top: 0; }

    .detalhe {
      display: block;
      margin-top: 6px;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
    }

    .acoes a.btn-link {
      justify-content: center;
      min-width: 85px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px 15px;
      }

      .item {
        align-items: stretch;
      }

      .acoes {
        width: 100%;
      }

      .acoes button {
        flex: 1;
      }
    }
  </style>
  <link rel="stylesheet" href="css/system.css">
</head>

<body class="page-medicacoes">
  <main class="container">
    <div class="med-topo">
      <h1>Painel de Medicações</h1>
      <a class="btn-link" href="almoxarifado.html">📦 Abrir almoxarifado</a>
    </div>

    <h2 class="primeiro">Pacientes aguardando medicação</h2>
    <p id="status-fila-med" class="vazio" role="status" aria-live="polite">Carregando pacientes...</p>
    <div id="fila-medicacao" class="lista"></div>

    <h2>Cadastro de medicações</h2>

    <form id="formMed">
      <label for="nome">Nome da medicação</label>
      <input
        id="nome"
        type="text"
        maxlength="150"
        placeholder="Ex.: Dipirona"
        autocomplete="off"
        required
      >

      <label for="quantidade">Quantidade em estoque (para entradas e saídas use o almoxarifado)</label>
      <input
        id="quantidade"
        type="number"
        min="0"
        step="1"
        value="0"
        inputmode="numeric"
        required
      >

      <button id="salvar" type="submit">
        Cadastrar Medicação
      </button>

      <button
        id="cancelar"
        class="cancelar"
        type="button"
        hidden
      >
        Cancelar edição
      </button>
    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>

    <h2>Medicações cadastradas</h2>

    <div id="lista" class="lista" aria-live="polite">
      <p class="vazio">Carregando medicações...</p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const sessao = Baymax.iniciar(["medicacao"]);

    const ESTOQUE_BAIXO = Baymax.ESTOQUE_BAIXO; // mesmo limite usado no almoxarifado

    const form = document.getElementById("formMed");
    const campoNome = document.getElementById("nome");
    const campoQuantidade = document.getElementById("quantidade");
    const botaoSalvar = document.getElementById("salvar");
    const botaoCancelar = document.getElementById("cancelar");
    const lista = document.getElementById("lista");
    const mensagem = document.getElementById("mensagem");

    let idEdicao = null;

    function mostrarMensagem(texto, erro = false) {
      mensagem.textContent = texto;
      mensagem.className = erro ? "erro" : "sucesso";
    }

    async function respostaJSON(resposta) {
      const texto = await resposta.text();
      let dados;

      try {
        dados = texto ? JSON.parse(texto) : {};
      } catch {
        throw new Error("Resposta inválida do servidor.");
      }

      if (!resposta.ok) {
        throw new Error(dados.erro || "Operação não realizada.");
      }

      return dados;
    }

    function cancelarEdicao() {
      idEdicao = null;
      form.reset();
      campoQuantidade.value = "0";
      botaoSalvar.textContent = "Cadastrar Medicação";
      botaoCancelar.hidden = true;
    }

    botaoCancelar.addEventListener("click", () => {
      cancelarEdicao();
      mostrarMensagem("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const nome = campoNome.value.trim();
      const quantidade = Number(campoQuantidade.value);

      if (!nome) {
        mostrarMensagem("Informe o nome da medicação.", true);
        return;
      }

      if (
        campoQuantidade.value === "" ||
        !Number.isInteger(quantidade) ||
        quantidade < 0
      ) {
        mostrarMensagem(
          "A quantidade deve ser um número inteiro maior ou igual a zero.",
          true
        );
        return;
      }

      botaoSalvar.disabled = true;
      botaoCancelar.disabled = true;

      try {
        const editando = idEdicao !== null;

        const url = editando
          ? `/lista-medicacoes/${idEdicao}`
          : "/lista-medicacoes";

        const resposta = await Baymax.fetch(url, {
          method: editando ? "PUT" : "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ nome, quantidade })
        });

        const dados = await respostaJSON(resposta);

        if (!dados.sucesso) {
          throw new Error("O servidor não confirmou a operação.");
        }

        cancelarEdicao();

        mostrarMensagem(
          editando
            ? "Medicação atualizada com sucesso!"
            : "Medicação cadastrada com sucesso!"
        );

        await carregarMedicacoes();
      } catch (erro) {
        mostrarMensagem(erro.message, true);
      } finally {
        botaoSalvar.disabled = false;
        botaoCancelar.disabled = false;

        botaoSalvar.textContent = idEdicao !== null
          ? "Salvar Alterações"
          : "Cadastrar Medicação";
      }
    });

    function iniciarEdicao(medicacao) {
      idEdicao = medicacao.id;
      campoNome.value = medicacao.nome;
      campoQuantidade.value = Number(medicacao.quantidade) || 0;

      botaoSalvar.textContent = "Salvar Alterações";
      botaoCancelar.hidden = false;

      mostrarMensagem("");
      campoNome.focus();

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function excluirMedicacao(medicacao) {
      const confirmou = confirm(
        `Deseja excluir a medicação "${medicacao.nome}"?`
      );

      if (!confirmou) return;

      try {
        const resposta = await Baymax.fetch(
          `/lista-medicacoes/${medicacao.id}`,
          {
            method: "DELETE",
            headers: { "Accept": "application/json" }
          }
        );

        const dados = await respostaJSON(resposta);

        if (!dados.sucesso) {
          throw new Error("O servidor não confirmou a exclusão.");
        }

        if (idEdicao === medicacao.id) {
          cancelarEdicao();
        }

        mostrarMensagem("Medicação excluída com sucesso!");
        await carregarMedicacoes();
      } catch (erro) {
        mostrarMensagem(erro.message, true);
      }
    }

    function textoEstoque(qtd) {
      if (qtd <= 0) return "Sem estoque";
      if (qtd === 1) return "1 unidade disponível";
      return `${qtd} unidades disponíveis`;
    }

    async function carregarMedicacoes() {
      lista.replaceChildren();

      const carregando = document.createElement("p");
      carregando.className = "vazio";
      carregando.textContent = "Carregando medicações...";
      lista.appendChild(carregando);

      try {
        const resposta = await Baymax.fetch("/lista-medicacoes", {
          headers: { "Accept": "application/json" }
        });

        const medicacoes = await respostaJSON(resposta);

        if (!Array.isArray(medicacoes)) {
          throw new Error("Lista de medicações inválida.");
        }

        lista.replaceChildren();

        if (medicacoes.length === 0) {
          const vazio = document.createElement("p");
          vazio.className = "vazio";
          vazio.textContent = "Nenhuma medicação cadastrada.";
          lista.appendChild(vazio);
          return;
        }

        medicacoes.forEach((medicacao) => {
          const qtd = Number(medicacao.quantidade) || 0;

          const item = document.createElement("div");
          item.className = "item";

          if (qtd <= 0) {
            item.classList.add("zerado");
          } else if (qtd <= ESTOQUE_BAIXO) {
            item.classList.add("baixo");
          }

          const info = document.createElement("div");
          info.className = "info";

          const nome = document.createElement("span");
          nome.className = "nome";
          nome.textContent = medicacao.nome;

          const estoque = document.createElement("span");
          estoque.className = "estoque";
          estoque.textContent = textoEstoque(qtd);

          info.append(nome, estoque);

          const acoes = document.createElement("div");
          acoes.className = "acoes";

          const editar = document.createElement("button");
          editar.type = "button";
          editar.textContent = "Editar";
          editar.addEventListener("click", () => {
            iniciarEdicao(medicacao);
          });

          const excluir = document.createElement("button");
          excluir.type = "button";
          excluir.className = "excluir";
          excluir.textContent = "Excluir";
          excluir.addEventListener("click", () => {
            excluirMedicacao(medicacao);
          });

          const movimentar = document.createElement("a");
          movimentar.className = "btn-link";
          movimentar.href = `almoxarifado.html?med=${encodeURIComponent(medicacao.id)}`;
          movimentar.textContent = "Entrada/Saída";

          acoes.append(editar, excluir, movimentar);
          item.append(info, acoes);
          lista.appendChild(item);
        });
      } catch (erro) {
        lista.replaceChildren();

        const aviso = document.createElement("p");
        aviso.className = "vazio";
        aviso.textContent = erro.message;
        lista.appendChild(aviso);
      }
    }

        // ---------- Pacientes aguardando medicação ----------

    const filaMed = document.getElementById("fila-medicacao");
    const statusFilaMed = document.getElementById("status-fila-med");
    let assinaturaFila = null;
    let carregandoFila = false;

    async function aplicarMedicacao(paciente) {
      const prescricao = paciente.prescricao || "a medicação prescrita";

      if (!confirm(`Confirmar a aplicação de "${prescricao}" em ${paciente.nome}?\nO estoque será atualizado automaticamente.`)) {
        return;
      }

      try {
        const resposta = await Baymax.fetch("/medicacao/aplicar", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ pacienteId: paciente.id })
        });

        const dados = await respostaJSON(resposta);
        mostrarMensagem(`${dados.mensagem} (${paciente.nome})`);

        assinaturaFila = null;
        await Promise.all([carregarFilaMedicacao(), carregarMedicacoes()]);
      } catch (erro) {
        mostrarMensagem(erro.message, true);
      }
    }

    async function carregarFilaMedicacao() {
      if (carregandoFila) return;
      carregandoFila = true;

      try {
        const resposta = await Baymax.fetch("/pacientes/medicacao", {
          headers: { "Accept": "application/json" }
        });

        const pacientes = await respostaJSON(resposta);

        if (!Array.isArray(pacientes)) throw new Error("Fila de medicação inválida.");

        statusFilaMed.textContent = pacientes.length
          ? `${pacientes.length} paciente${pacientes.length === 1 ? "" : "s"} aguardando`
          : "Nenhum paciente aguardando medicação.";

        const assinatura = JSON.stringify(pacientes);
        if (assinatura === assinaturaFila) return;
        assinaturaFila = assinatura;

        filaMed.replaceChildren(...pacientes.map(paciente => {
          const item = document.createElement("div");
          item.className = "item";

          const info = document.createElement("div");
          info.className = "info";

          const nome = document.createElement("span");
          nome.className = "nome";
          nome.textContent = paciente.nome || "Paciente sem nome";

          const prescricao = document.createElement("span");
          prescricao.className = "estoque";
          prescricao.textContent = `Prescrição: ${paciente.prescricao || "Não informada"}`;

          const diagnostico = document.createElement("span");
          diagnostico.className = "detalhe";
          diagnostico.textContent = `Diagnóstico: ${paciente.diagnostico || "N/A"}`;

          info.append(nome, prescricao, diagnostico);
          const detalhesPrescricao = paciente.prescricaoDetalhes;
          if (detalhesPrescricao) {
            const detalhes = document.createElement("span");
            detalhes.className = "detalhe";
            detalhes.textContent = [
              detalhesPrescricao.dose,
              detalhesPrescricao.via,
              detalhesPrescricao.frequencia,
              detalhesPrescricao.quantidade ? `${detalhesPrescricao.quantidade} un.` : ""
            ].filter(Boolean).join(" · ");
            if (detalhes.textContent) info.appendChild(detalhes);
          }

          const acoes = document.createElement("div");
          acoes.className = "acoes";

          const aplicar = document.createElement("button");
          aplicar.type = "button";
          aplicar.textContent = "Aplicar medicação";
          aplicar.addEventListener("click", () => aplicarMedicacao(paciente));

          acoes.appendChild(aplicar);
          item.append(info, acoes);
          return item;
        }));
      } catch (erro) {
        statusFilaMed.textContent = erro.message;
      } finally {
        carregandoFila = false;
      }
    }

    if (sessao) {
      carregarMedicacoes();
      carregarFilaMedicacao();
      setInterval(carregarFilaMedicacao, 5000);
    }
  </script>
</body>
</html>
